// --- Cleanup: Ensure all required fields exist (Fixes budget error) ---

    if (typeof agent.syzygy_partner === 'undefined') agent.syzygy_partner = null;
    if (typeof agent.host === 'undefined') agent.host = 'http://127.0.0.1';

    if (typeof agent.budget.resource_cycles_remaining === 'undefined') agent.budget.resource_cycles_remaining = 100000;
});


// --- UTILITY: ON-SCREEN LOGGING ---
const $ = (id) => document.getElementById(id);

const log = (msg, type = 'sys') => { 
    const box = $('systemLog');
    if (!box) return;

    const el = document.createElement('div');
    const color = type === 'error' ? 'var(--error-color)' : type === 'ok' ? 'var(--main-color)' : 'var(--dim-text)';
    el.style.color = color;
    el.style.marginBottom = '4px';
    el.innerHTML = `<span style="opacity:0.5;">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
    
    if (box.firstChild) {
        box.prepend(el);
    } else {
        box.appendChild(el);
    }
    
    while (box.children.length > 50) {
        box.removeChild(box.lastChild);
    }
};
log("System Log Ready.");


// --- 1. EMBEDDED PERSISTENCE (SimpleDB) ---
class SimpleDB {
    constructor(dbName = 'MythOS_Vault', version = 4) { 
        this.dbName = dbName;
        this.version = version;
        this.db = null;
        this.ready = this.init();
    }

    async init() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);

            request.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains('agents')) db.createObjectStore('agents', { keyPath: 'id' });
                if (!db.objectStoreNames.contains('vectors')) {
                    const store = db.createObjectStore('vectors', { keyPath: 'id' });
                    store.createIndex('agentId', 'agent_id', { unique: false });
                }
                log('IndexedDB Schema Forged.', 'ok');
            };

            request.onsuccess = (e) => {
                this.db = e.target.result;
                resolve();
            };

            request.onerror = (e) => reject(e);
        });
    }

    async tx(store, mode, fn) {
        await this.ready;
        return new Promise((resolve, reject) => {
            const t = this.db.transaction(store, mode);
            const s = t.objectStore(store);
            const req = fn(s);
            
            if (req instanceof IDBRequest) { 
                req.onsuccess = () => resolve(req.result); 
                req.onerror = () => reject(t.error); 
            } else { 
                t.oncomplete = () => resolve(); 
                t.onerror = () => reject(t.error); 
            }
        });
    }

    async put(store, item) { return this.tx(store, 'readwrite', s => s.put(item)); }
    async getAll(store) { return this.tx(store, 'readonly', s => s.getAll()); }
    async clear(store) { return this.tx(store, 'readwrite', s => s.clear()); }
    async count(store) { return this.tx(store, 'readonly', s => s.count()); }
}
const DB_INSTANCE = new SimpleDB();


// --- 2. MANAGEMENT LOGIC ---

/** Renders agents into the list display */
const renderAgentList = (agents) => {
    const listEl = $('agentList');
    const countDisplay = $('countDisplay');
    if (!listEl) return;

    listEl.innerHTML = '';
    
    if (agents.length === 0) {
        listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#444;">DATABASE SCANNED. NO LIAS MANIFESTED.</div>';
        countDisplay.textContent = '0 AGENTS';
        return;
    }

    // Sort by canonical port order
    agents.sort((a, b) => (a.port || 9999) - (b.port || 9999));
    
    agents.forEach(agent => {
        const div = document.createElement('div');
        div.className = 'agent-item';
        
        const statusColor = agent.onboarding_status === 'ONBOARDED' ? 'var(--main-color)' : 'var(--dim-text)';
        
        // Safe handling of role_layer - handle undefined/null cases
        const roleDisplay = agent.role_layer 
            ? agent.role_layer.split('/')[0].trim() 
            : 'Unknown Role';
        
        div.innerHTML = `
            <div>
                <strong style="color:var(--text-color);">${agent.handle || agent.id || 'Unknown'}</strong> 
                <span style="opacity: 0.7; font-size: 0.9em; color:var(--dim-text)">(${roleDisplay})</span>
            </div>
            <span style="font-size: 0.8em; color: ${statusColor};">
                Port: ${agent.port || 'N/A'} | ${agent.onboarding_status || 'UNKNOWN'}
            </span>
        `;
        listEl.appendChild(div);
    });
    countDisplay.textContent = `${agents.length} AGENTS`;
};

/** Initializes all agents from the canonical manifest */
const initializeManifest = async () => {
    const btn = $('initializeBtn');
    
    try {
        const agentCount = await DB_INSTANCE.count('agents');
        if (agentCount > 0) {
            log(`Vault already contains ${agentCount} agents. Initialization aborted. Purge first.`, 'error');
            return;
        }
    } catch (e) {
        log(`DB Read Error during check: ${e.message}`, 'error');
        return;
    }

    btn.disabled = true;
    btn.textContent = "WRITING MANIFEST...";

    try {
        log("Executing Canonical Manifest Initialization Protocol...");
        
        const agentPromises = InitialAgentManifest.map(agent => DB_INSTANCE.put('agents', agent));
        await Promise.all(agentPromises);
        
        log(`SUCCESS: ${InitialAgentManifest.length} agents initialized with canonical ports (4000-4015).`, 'ok');
        await manageUI.refreshList(); 
    } catch (err) {
        log(`CRITICAL FAILURE: Initialization failed. ${err.message}`, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = "INITIALIZE MANIFEST (4000-4015)";
    }
};

const manageUI = {
    
    handleInitBtn: async () => {
        await initializeManifest();
    },

    async refreshList() {
        try { 
            $('status').textContent = 'DB ONLINE';
            $('status').style.color = "var(--main-color)";
            const agents = await DB_INSTANCE.getAll('agents'); 
            renderAgentList(agents); 
            log(`Manifest Refreshed. Total Agents: ${agents.length}`, 'ok'); 
        } catch (err) { 
            log(`READ ERROR: ${err.message}`, 'error'); 
        }
    },

    async handlePurge() {
        const purgeBtn = $('purgeBtn');
        try {
            if (!confirm("CRITICAL WARNING: This will delete ALL data. Proceed?")) throw new Error("Purge Protocol aborted by HITL.");
            
            purgeBtn.disabled = true;
            log("Initiating Purge Protocol...", 'error');
            
            await DB_INSTANCE.clear('agents');
            await DB_INSTANCE.clear('vectors');
            
            const req = indexedDB.deleteDatabase('MythOS_Vault');
            await new Promise((resolve) => { req.onsuccess = resolve; req.onerror = resolve; }); 
            
            log("DATABASE PURGED. System reset. Reloading manager...", 'error');
            setTimeout(() => location.reload(), 500); 
        } catch(err) {
            if (!err.message.includes("aborted")) {
                log(`PURGE ERROR: ${err.message}`, 'error');
            }
        } finally {
            purgeBtn.disabled = false;
        }
    },
};


// --- 3. EVENT WIRING AND INITIAL LOAD ---
window.addEventListener('DOMContentLoaded', async () => {
    
    // 1. Initial DB status check
    try {
        await DB_INSTANCE.ready; 
        $('status').textContent = "DB ONLINE";
        $('status').style.color = "var(--main-color)";
    } catch (e) {
        $('status').textContent = "DB ERROR";
        $('status').style.color = "var(--error-color)";
        log(`CRITICAL INIT ERROR: Database failed. ${e.message || e}`, 'error');
    }

    // 2. Event Wiring
    $('initializeBtn').addEventListener('click', manageUI.handleInitBtn); 
    $('refreshBtn')?.addEventListener('click', manageUI.refreshList);
    $('purgeBtn')?.addEventListener('click', manageUI.handlePurge);
    
    // 3. Initial List Load
    manageUI.refreshList();
});
</script>
