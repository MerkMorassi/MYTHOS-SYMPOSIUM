<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MYTHOS :: FIRECHAT [FORGE v1.7]</title>
<style>
  :root { --bg:#050505; --panel:#111; --term:#121212; --text:#e0e0e0; --dim:#777; --accent:#ff3300; --sys:#3399ff; --ok:#00ff41; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; height:100vh; background:var(--bg); color:var(--text); font-family:'JetBrains Mono', monospace; display:flex; flex-direction:column; overflow:hidden; }
  
  header { display:flex; justify-content:space-between; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:10px; }
  main { flex:1; display:flex; gap:16px; overflow:hidden; }
  
  aside { width:340px; background:var(--panel); border:1px solid #333; display:flex; flex-direction:column; }
  .sidebar-content { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:15px; }
  
  section { flex:1; display:flex; flex-direction:column; background:var(--term); border:1px solid #333; }
  
  /* TABS */
  .tabs { display:flex; border-bottom:1px solid #333; background:#000; }
  .tab { flex:1; padding:8px; text-align:center; cursor:pointer; color:var(--dim); border:none; background:transparent; font-family:inherit; text-transform:uppercase; font-size:0.8em; }
  .tab:hover { color:#fff; }
  .tab.active { background:var(--accent); color:#000; font-weight:bold; }

  label { font-size:0.75em; color:var(--dim); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
  input, textarea, select { width:100%; background:#222; border:1px solid #444; color:#fff; padding:6px; font-family:inherit; font-size:0.9em; }
  input:focus, textarea:focus { border-color:var(--accent); outline:none; }
  
  button { background:#222; color:#fff; border:1px solid #444; padding:8px; cursor:pointer; font-family:inherit; text-transform:uppercase; font-size:0.8em; transition:0.2s; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:#331100; border-color:#662200; }
  button.primary:hover { background:var(--accent); color:#000; }
  
  #messages { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { border-left:3px solid #444; padding-left:10px; white-space:pre-wrap; line-height:1.4; }
  .msg.user { border-color:var(--ok); }
  .msg.agent { border-color:var(--accent); }
  .msg.sys { border-color:var(--sys); color:var(--sys); font-size:0.85em; }
  
  .d-none { display:none !important; }
  progress { width:100%; height:6px; background:#222; border:none; margin-top:5px; }
  progress::-webkit-progress-value { background:var(--accent); }
</style>
</head>
<body>

<header>
  <div><strong>MYTHOS</strong> :: FIRECHAT [FORGE v1.7]</div>
  <div id="status" style="color:var(--dim)">[ STANDBY ]</div>
</header>

<main>
  <aside>
    <div class="tabs">
      <button id="btnTabChat" class="tab active">Comms</button>
      <button id="btnTabForge" class="tab">Forge</button>
    </div>

    <div id="tabChat" class="sidebar-content">
      <div>
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AIza...">
      </div>
      <div>
        <label>Active Channel (Locus)</label>
        <select id="agentSelect"><option disabled selected>-- Empty --</option></select>
      </div>
      <div>
        <label>Load LorePack (JSON)</label>
        <input type="file" id="loreLoadInput" multiple accept=".json">
      </div>
      <div style="margin-top:auto;">
        <button id="btnPurge" style="width:100%; color:#f44; border-color:#522;">/PURGE_MEMORY</button>
      </div>
    </div>

    <div id="tabForge" class="sidebar-content d-none">
      <div style="background:#1a1a1a; padding:10px; border:1px solid #333;">
        <label style="color:var(--accent);">TARGET IDENTITY</label>
        <input id="forgeAgentId" value="MERKOS" style="font-weight:bold; color:var(--accent);">
      </div>
      
      <div>
        <label>Raw Scripts (.txt)</label>
        <input type="file" id="forgeFileInput" multiple accept=".txt,.md">
        <div id="forgeQueue" style="font-size:0.8em; color:#666; margin-top:5px;">0 files queued</div>
      </div>

      <div>
        <label>Concurrency</label>
        <input type="number" id="concurrency" value="5" min="1" max="10">
      </div>

      <button id="btnIngest" class="primary">IGNITE FORGE</button>
      <button id="btnExport">EXPORT COREPACK</button>

      <div id="forgeProgress" class="d-none">
        <label>Saturation</label>
        <progress id="ingestBar" value="0" max="100"></progress>
        <div id="ingestStats" style="font-size:0.8em; text-align:center;">0/0</div>
      </div>
    </div>
  </aside>

  <section>
    <div id="messages">
      <div class="msg sys">NOESIS: Firechat v1.7 Online. Event bindings secured.</div>
    </div>
    <div style="padding:10px; border-top:1px solid #333; display:flex; gap:10px;">
      <textarea id="userInput" rows="2" placeholder="Open channel..."></textarea>
      <button id="btnSend" style="width:100px;">SEND</button>
    </div>
  </section>
</main>

<script type="module">
import { SimpleDB } from './js/mythos-db.js';

// --- STATE ---
const DB = new SimpleDB();
let STATE = {
  agentMap: {},
  apiKey: localStorage.getItem('mythos_api_key') || ''
};

// --- DOM UTILS ---
const $ = id => document.getElementById(id);
function log(text, type='sys') {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

// --- INIT ---
if(STATE.apiKey) $('apiKey').value = STATE.apiKey;

$('apiKey').onchange = () => {
  STATE.apiKey = $('apiKey').value.trim();
  localStorage.setItem('mythos_api_key', STATE.apiKey);
};

// --- LOGIC: FORGE (INGESTION) ---
async function igniteForge() {
    const files = $('forgeFileInput').files;
    const agentId = $('forgeAgentId').value.trim().toUpperCase();
    const key = STATE.apiKey;
    const concurrency = parseInt($('concurrency').value) || 5;

    if (!files.length || !agentId || !key) return alert("Missing Inputs");

    $('btnIngest').disabled = true;
    $('forgeProgress').classList.remove('d-none');
    log(`Forging [${agentId}]...`, 'sys');

    await DB.ready;
    let items = [];
    
    // Chunking
    for (const f of files) {
        const txt = await f.text();
        const chunks = txt.match(/[^.!?]+[.!?]+|\S+/g) || [];
        let buffer = "";
        for(let s of chunks) {
            if((buffer + s).length > 600) {
                if(buffer.length > 20) items.push({text: buffer, source: f.name});
                buffer = s;
            } else { buffer += " " + s; }
        }
        if(buffer.length > 20) items.push({text: buffer, source: f.name});
    }

    let active = 0;
    let completed = 0;
    const total = items.length;
    
    // Worker
    const next = async () => {
        if (items.length === 0) return;
        active++;
        const task = items.shift();
        
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent?key=${key}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: { parts: [{ text: task.text }] } })
            });
            const data = await res.json();
            if (data.embedding) {
                await DB.put('vectors', {
                    id: crypto.randomUUID(),
                    agentId: agentId,
                    text: task.text,
                    vector: data.embedding.values,
                    source: task.source,
                    timestamp: Date.now()
                });
                completed++;
            }
        } catch (e) { console.warn(e); } 
        
        active--;
        $('ingestBar').value = (completed / total) * 100;
        $('ingestStats').textContent = `${completed} nodes forged`;
        
        if (items.length > 0) await next();
    };

    const threads = [];
    for (let i = 0; i < concurrency; i++) threads.push(next());
    await Promise.all(threads);

    log(`Forge Complete. ${completed} vectors assigned to ${agentId}.`, 'sys');
    $('btnIngest').disabled = false;
    alert("Ingestion Complete. Load in Comms tab.");
    await loadFromDB(); // Reload memory
}

async function exportCorePack() {
    const agentId = $('forgeAgentId').value.trim().toUpperCase();
    await DB.ready;
    const all = await DB.getAll('vectors');
    const mine = all.filter(v => v.agentId === agentId);
    
    if(!mine.length) return alert("No vectors found for " + agentId);
    
    const blob = new Blob([JSON.stringify({
        schema: "MYTHOS.COREPACK.v1",
        agentId: agentId,
        nodes: mine
    })], {type: "application/json"});
    
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${agentId}.COREPACK.json`;
    a.click();
    log(`Exported ${mine.length} nodes.`, 'sys');
}

// --- LOGIC: COMMS (CHAT) ---
async function loadFromDB() {
    await DB.ready;
    const all = await DB.getAll('vectors');
    STATE.agentMap = {};
    all.forEach(v => {
        const id = v.agentId || "UNKNOWN";
        if (!STATE.agentMap[id]) STATE.agentMap[id] = [];
        STATE.agentMap[id].push(v);
    });
    updateSelect();
}

$('loreLoadInput').onchange = async () => {
    for (const f of $('loreLoadInput').files) {
        const json = JSON.parse(await f.text());
        const nodes = json.nodes || json.sacred_archive || (Array.isArray(json) ? json : []);
        const id = json.agentId || nodes[0]?.agentId || "UNKNOWN";
        
        if (!STATE.agentMap[id]) STATE.agentMap[id] = [];
        STATE.agentMap[id].push(...nodes);
        log(`Loaded ${nodes.length} nodes for [${id}]`, 'sys');
    }
    updateSelect();
};

function updateSelect() {
    const sel = $('agentSelect');
    sel.innerHTML = '<option disabled>-- Select Locus --</option>';
    Object.keys(STATE.agentMap).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = `${k} (${STATE.agentMap[k].length})`;
        sel.appendChild(opt);
    });
    if(Object.keys(STATE.agentMap).length > 0) sel.selectedIndex = 1;
}

async function sendChat() {
    const q = $('userInput').value.trim();
    const id = $('agentSelect').value;
    const key = STATE.apiKey;
    
    if(!q || !key || !id) return;
    
    $('userInput').value = '';
    log(q, 'user');
    $('status').textContent = `[ Contacting ${id}... ]`;
    
    const memory = STATE.agentMap[id] || [];
    let context = "";
    
    if(memory.length > 0) {
        // Embed Query
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/text-embedding-004:embedContent?key=${key}`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ content: { parts: [{ text: q }] } })
        });
        const vec = (await res.json()).embedding.values;
        
        // Cosine
        const scored = memory.map(m => {
            let dot=0, mA=0, mB=0;
            for(let i=0; i<vec.length; i++){ dot += vec[i]*m.vector[i]; mA += vec[i]**2; mB += m.vector[i]**2; }
            return { ...m, score: dot / (Math.sqrt(mA)*Math.sqrt(mB)) };
        }).sort((a,b) => b.score - a.score).slice(0, 8);
        
        context = scored.map(s => s.text).join("\n---\n");
    }
    
    const prompt = `SYSTEM: You are ${id}. Answer based on the context below.\n\nCONTEXT:\n${context}\n\nUSER: ${q}`;
    
    const genRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${key}`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
    });
    const genData = await genRes.json();
    const reply = genData.candidates?.[0]?.content?.parts?.[0]?.text || "[Signal Lost]";
    
    log(reply, 'agent');
    $('status').textContent = `[ STANDBY ]`;
}

// --- BINDINGS (The Fix) ---
$('btnSend').addEventListener('click', sendChat);
$('userInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

$('btnIngest').addEventListener('click', igniteForge);
$('btnExport').addEventListener('click', exportCorePack);

$('btnTabChat').addEventListener('click', () => switchTab('tabChat'));
$('btnTabForge').addEventListener('click', () => switchTab('tabForge'));

$('btnPurge').addEventListener('click', async () => {
    if(confirm("NUKE DATABASE?")) { await DB.clear('vectors'); location.reload(); }
});

function switchTab(tabId) {
    ['tabChat', 'tabForge'].forEach(t => $(t).classList.add('d-none'));
    $(tabId).classList.remove('d-none');
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    // Simple active toggle for buttons based on ID mapping
    if(tabId === 'tabChat') $('btnTabChat').classList.add('active');
    if(tabId === 'tabForge') $('btnTabForge').classList.add('active');
}

// Auto-load
loadFromDB();
</script>
</body>
</html>
