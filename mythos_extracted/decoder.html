<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MYTHOS :: L-Space Decoder</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        #viewer { background: #000; border: 1px solid #333; height: 650px; overflow-y: auto; padding: 20px; font-family: monospace; font-size: 12px; color: #00ffaa; line-height: 1.5; }
        .entry { margin-bottom: 15px; border-bottom: 1px solid #111; padding-bottom: 10px; }
        .meta { color: #555; font-size: 10px; margin-bottom: 3px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        #search { flex: 1; background: #000; border: 1px solid #00ffaa; color: #00ffaa; padding: 10px; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>L-SPACE MANIFEST DECODER v1.1</h1>
        <div class="input-group">
            <input type="file" id="manifestPicker" accept=".json" class="d-none">
            <label for="manifestPicker" class="file-btn">+ SCAN SACRED ARCHIVE (JSON)</label>
        </div>
        <div id="stats" class="msg sys d-none">Locus: <span id="locus">--</span> | Nodes: <span id="count">0</span></div>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Filter nodes (e.g. 'personality profile')...">
            <button id="filterBtn">EXECUTE FILTER</button>
        </div>
        <div id="viewer">READY FOR DECODING.</div>
    </main>
    <script>
        const picker = document.getElementById('manifestPicker');
        const viewer = document.getElementById('viewer');
        const countDisplay = document.getElementById('count');
        const locusDisplay = document.getElementById('locus');
        const searchInput = document.getElementById('search');
        const filterBtn = document.getElementById('filterBtn');
        let archive = [];

        function render(nodes) {
            viewer.innerHTML = nodes.slice(0, 500).map((n, i) => `
                <div class="entry">
                    <div class="meta">NODE ${i} | SOURCE: ${n.metadata?.source || 'UNKNOWN'}</div>
                    <div class="text">${n.text}</div>
                </div>
            `).join('');
            if (nodes.length > 500) viewer.innerHTML += `<div class="msg sys">... ${nodes.length - 500} MORE NODES BUFFERED.</div>`;
        }

        picker.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            viewer.textContent = "DECODING LATTICE... STAND BY.";
            try {
                const data = JSON.parse(await file.text());
                archive = data.sacred_archive || data.nodes || [];
                locusDisplay.textContent = data.agentId || "UNKNOWN";
                countDisplay.textContent = archive.length.toLocaleString();
                document.getElementById('stats').classList.remove('d-none');
                render(archive);
            } catch (err) { viewer.innerHTML = '<div class="msg err">SCAN FAILURE: ' + err.message + '</div>'; }
        };

        filterBtn.onclick = () => {
            const term = searchInput.value.toLowerCase();
            render(archive.filter(n => n.text.toLowerCase().includes(term)));
        };
    </script>
</body>
</html>
