<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>MYTHOS :: FORGE [INGESTION]</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        /* --- FORGE SPECIFIC OVERRIDES --- */
        body { overflow-y: auto; }
        main { padding: 20px; display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; height: auto; }
        
        h1 { font-size: 1.2em; color: #ffcc00; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; letter-spacing: 2px; }
        
        /* Dashboard Grid */
        .stats-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 20px 0;
            background: #080808;
            padding: 15px;
            border: 1px solid #333;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            border: 1px solid #222;
            padding: 10px;
        }
        
        .stat-label { font-size: 0.6em; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .stat-value { font-size: 1.2em; color: #e0e0e0; font-weight: bold; font-family: monospace; }
        .stat-value.active { color: #00ffaa; text-shadow: 0 0 5px rgba(0, 255, 170, 0.5); }
        
        /* Queue Panel */
        #queuePanel {
            background: #080808;
            border: 1px solid #333;
            padding: 15px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #00ffaa; font-size: 0.8em; }
        .file-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #222; font-size: 0.8em; }
        .file-item:last-child { border-bottom: none; }
        .file-status { color: #666; }
        .file-status.done { color: #00ffaa; }
        .file-status.error { color: #ff3300; }
        
        /* Progress Bar */
        progress { width: 100%; height: 20px; background: #000; border: 1px solid #333; margin-top: 10px; appearance: none; }
        progress::-webkit-progress-bar { background: #000; }
        progress::-webkit-progress-value { background: #004400; border-right: 2px solid #00ffaa; }
        #progressLabel { text-align: center; font-size: 0.7em; color: #666; margin-top: 5px; }

        /* Helpers */
        .d-flex { display: flex; gap: 20px; margin-bottom: 15px; }
        .flex-1 { flex: 1; }
        .mini-btn { padding: 2px 8px; font-size: 0.7em; background: #222; border: 1px solid #444; color: #ccc; cursor: pointer; }
        .mini-btn:hover { background: #333; color: #fff; }
        
        textarea { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 10px; font-family: monospace; resize: vertical; }
    </style>
</head>
<body>

<header>
    <div><strong>MYTHOS</strong> // LOREPACK FORGE</div>
    <div id="connection-status" style="color: #666;">[ STANDALONE ]</div>
</header>

<main>
    <h1>INGESTION PROTOCOL v3.6</h1>

    <div class="d-flex">
        <div class="flex-1">
            <label style="color: #ff3300">AGENT ID (LOCUS)</label>
            <input id="agentId" placeholder="MERKOS" value="MERKOS">
        </div>
        <div class="flex-1">
            <label>AGENT HANDLE</label>
            <input id="agentHandle" placeholder="@merkos" value="@merkos">
        </div>
        <div style="width: 100px;">
            <label>THREADS</label>
            <input id="concurrency" type="number" value="5" min="1" max="50">
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <label>GEMINI API KEYS (One per line for rotation)</label>
        <textarea id="apiKey" rows="3" placeholder="AIza..."></textarea>
    </div>

    <div style="background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 20px;">
        <label style="color: #00ffaa; margin-bottom: 10px;">SOURCE MATERIAL</label>
        <div class="d-flex" style="align-items: center; gap: 10px;">
            <input type="file" id="fileInput" multiple style="border: 1px dashed #444; padding: 20px;">
            <button id="ingestBtn" class="primary" style="height: 60px; padding: 0 30px; font-size: 1.1em;">IGNITE FORGE</button>
        </div>
        <div id="fileCount" style="margin-top: 5px; font-size: 0.8em; color: #666;">0 files selected</div>
    </div>

    <div id="statsBox" class="stats-dashboard">
        <div class="stat-item"><span class="stat-label">ELAPSED</span><span id="timerDisplay" class="stat-value active">00:00</span></div>
        <div class="stat-item"><span class="stat-label">THREADS</span><span id="statThreads" class="stat-value">0</span></div>
        <div class="stat-item"><span class="stat-label">CHUNKS</span><span id="statChunks" class="stat-value">0</span></div>
        <div class="stat-item"><span class="stat-label">VECTORS</span><span id="statVectors" class="stat-value">0</span></div>
        <div class="stat-item"><span class="stat-label">SPEED</span><span id="statSpeed" class="stat-value">0/s</span></div>
    </div>

    <div style="margin-bottom: 20px;">
        <progress id="progressBar" value="0" max="100"></progress>
        <div id="progressLabel">READY TO FORGE</div>
    </div>

    <div id="queuePanel">
        <div class="queue-header">
            <span>PROCESSING QUEUE</span>
            <button id="clearQueueBtn" class="mini-btn">CLEAR</button>
        </div>
        <div id="queueList">
            </div>
    </div>

</main>

<script type="module">
    import { bindLorepackUI } from './js/ingestion/lorepack.js';
    
    document.addEventListener('DOMContentLoaded', () => {
        // Hydrate API Key
        const savedKey = localStorage.getItem('mythos_api_key');
        if(savedKey) document.getElementById('apiKey').value = savedKey;

        // Auto-save Key
        document.getElementById('apiKey').addEventListener('change', (e) => {
            localStorage.setItem('mythos_api_key', e.target.value.trim().split('\n')[0]);
        });

        // Initialize Logic
        try {
            bindLorepackUI();
            console.log("Lorepack UI Bound.");
        } catch(e) {
            console.error("Failed to bind Lorepack UI:", e);
            document.getElementById('progressLabel').innerText = "ERROR: LOGIC MODULE MISSING";
            document.getElementById('progressLabel').style.color = "red";
        }
    });
</script>

</body>
</html>
