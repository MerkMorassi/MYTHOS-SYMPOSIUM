<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MYTHOS :: HYBRID LATTICE [v4.1]</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { overflow: hidden; display: flex; flex-direction: column; height: 100vh; background: #050505; color: #e0e0e0; font-family: monospace; }
        .d-none { display: none !important; }
        
        /* PRESERVED UI STYLE */
        #messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { border-left: 3px solid #444; padding-left: 10px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 5px; }
        .message.agent { border-color: #ff3300; background: #111; padding: 15px; border-radius: 0 8px 8px 0; }
        .message.user { border-color: #00ffaa; text-align: right; padding-right: 10px; border-right: 3px solid #00ffaa; border-left: none; }
        .message.system { border-color: #3399ff; color: #88ccff; font-style: italic; font-size: 0.8em; text-align: center; border: none; }
        .message.error { border-color: #ff0000; color: #ff8888; background: #220000; padding:10px; border: 1px solid #f00; }
        
        #status-bar { border-top: 1px solid #333; padding: 8px; font-size: 0.75em; color: #666; display: flex; justify-content: space-between; background: #080808; }
        .badge-local { background: #ff3300; color: #000; padding: 2px 5px; font-size: 0.6em; border-radius: 3px; font-weight: bold; }
        .badge-cloud { background: #00ffaa; color: #000; padding: 2px 5px; font-size: 0.6em; border-radius: 3px; font-weight: bold; }
        
        /* Selectors */
        select { background: #000; color: #fff; border: 1px solid #333; padding: 5px; width: 100%; margin-top: 5px; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div><strong>MYTHOS</strong> // HYBRID LATTICE [v4.1]</div>
    <div id="connection-status" style="color: #666;">[ READY ]</div>
</header>

<main>
    <aside>
        <div class="tabs">
            <button id="tab-comms" class="tab active">COMMS</button>
            <button id="tab-forge" class="tab">FORGE</button>
        </div>

        <div id="panel-comms" class="sidebar-content">
            <label>API KEY</label>
            <input type="password" id="api-key" placeholder="AIza...">
            
            <label style="margin-top:15px; color: #ffcc00;">NEURAL ENGINE</label>
            <select id="model-select">
                <optgroup label="CLOUD (Google)">
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash" selected>Gemini 2.5 Flash</option>
                </optgroup>
                <optgroup label="LOCAL (WebGPU)">
                    <option value="onnx-community/Llama-3.2-1B-Instruct">Llama 3.2 (1B)</option>
                    <option value="onnx-community/Qwen2.5-1.5B-Instruct">Qwen 2.5 (1.5B)</option>
                </optgroup>
            </select>

            <label style="margin-top:15px">ACTIVE LOCUS</label>
            <select id="agent-select"><option>Loading...</option></select>
            
            <div style="margin-top: auto;">
                <button id="btn-purge" class="danger" style="width:100%">/PURGE_MEMORY</button>
            </div>
        </div>

        <div id="panel-forge" class="sidebar-content d-none">
            <label style="color:#ff3300">TARGET IDENTITY</label>
            <input id="forgeAgentId" value="MERKOS" style="font-weight:bold; color:#ff3300">
            <label style="margin-top:10px">SOURCE FILES</label>
            <input type="file" id="forgeFileInput" multiple>
            <div id="forgeQueue" style="font-size:0.7em; color:#666">0 files</div>
            <label style="margin-top:10px">THREADS</label>
            <input type="number" id="concurrency" value="5" min="1">
            <button id="btnIngest" class="primary" style="margin-top:10px">IGNITE FORGE</button>
            <button id="btnExport" style="margin-top:5px">EXPORT COREPACK</button>
            <div id="forgeProgress" class="d-none">
                <progress id="ingestBar" value="0" max="100"></progress>
                <div id="ingestStats" style="text-align:center; font-size:0.7em">0/0</div>
            </div>
        </div>
    </aside>

    <section>
        <div id="messages-container"></div>
        <div class="input-area" style="background:#111; padding:15px; border-top:1px solid #333;">
            <textarea id="message-input" rows="2" placeholder="Signal the Lattice..."></textarea>
            <button id="send-button" style="width:100px; height: 100%;">SEND</button>
        </div>
        <div id="status-bar">
            <span id="focus-status">FOCUS: DIRECT</span>
            <span id="vector-count">VECTORS: 0</span>
        </div>
    </section>
</main>

<script type="module">
    import { InitialAgentManifest } from './js/agents/initial-manifest.js';
    import { AgentRuntime } from './js/agents/agent-runtime.js';
    import { ConferenceRoom } from './js/comms/conference.js';
    import { SimpleDB } from './js/core/mythos-db.js';
    import { NumMarkX } from './js/memory/numark-x.js';
    let bindLorepackUI = () => {};
    try { const m = await import('./js/ingestion/lorepack.js'); bindLorepackUI = m.bindLorepackUI; } catch(e){}

    const STATE = { db: new SimpleDB(), conference: null, agents: {}, key: localStorage.getItem('mythos_api_key') || '' };
    const UI = {
        key: document.getElementById('api-key'),
        model: document.getElementById('model-select'),
        sel: document.getElementById('agent-select'),
        msgs: document.getElementById('messages-container'),
        input: document.getElementById('message-input'),
        btn: document.getElementById('send-button'),
        stat: document.getElementById('connection-status'),
        vec: document.getElementById('vector-count'),
        panelComms: document.getElementById('panel-comms'),
        panelForge: document.getElementById('panel-forge')
    };

    async function boot() {
        if(STATE.key) UI.key.value = STATE.key;
        renderMsg('SYSTEM', 'Initializing Hybrid Lattice v4.1...', 'system');

        try {
            bindLorepackUI();
            await STATE.db.ready;
            const vectors = await STATE.db.getAll('vectors');
            UI.vec.textContent = `VECTORS: ${vectors.length}`;
            NumMarkX.initialize(vectors);

            const selectedModel = UI.model.value;
            for(const meta of InitialAgentManifest) {
                const metaWithModel = { ...meta, default_model: selectedModel };
                STATE.agents[meta.id] = new AgentRuntime({ agentMeta: metaWithModel, db: STATE.db });
            }

            STATE.conference = new ConferenceRoom({
                agents: STATE.agents,
                db: STATE.db,
                renderer: {
                    agent: (id, txt) => renderMsg(id, txt, 'agent'),
                    user: (txt) => { /* Suppress duplicate rendering here, UI handles it */ },
                    error: (id, txt) => renderMsg(id, txt, 'error'),
                    system: (txt) => renderMsg('SYSTEM', txt, 'system')
                }
            });

            populateRoster();
            UI.stat.textContent = '[ ONLINE ]';
            UI.stat.style.color = '#00ffaa';
            renderMsg('SYSTEM', `Hybrid Core Active. Engine: ${selectedModel}`, 'system');

        } catch(e) {
            console.error(e);
            renderMsg('SYSTEM', `Boot Error: ${e.message}`, 'error');
        }
    }

    function populateRoster() {
        UI.sel.innerHTML = '';
        // Add "All" option if desired, but user wants focus
        const allOpt = document.createElement('option');
        allOpt.value = 'ALL';
        allOpt.textContent = 'CHORUS (All Agents)';
        UI.sel.appendChild(allOpt);

        InitialAgentManifest.forEach(a => {
            const opt = document.createElement('option');
            opt.value = a.id;
            opt.textContent = a.handle;
            UI.sel.appendChild(opt);
        });
        if(STATE.agents['MERKOS']) UI.sel.value = 'MERKOS';
    }

    function renderMsg(from, text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        
        let badge = '';
        if (type === 'agent') {
            const isLocal = UI.model.value.startsWith('onnx');
            const label = isLocal ? 'SILICON' : 'CLOUD';
            const cls = isLocal ? 'badge-local' : 'badge-cloud';
            badge = `<span class="${cls}">${label}</span> `;
        }

        div.innerHTML = `${badge}<strong>${from}:</strong> ${text}`;
        UI.msgs.appendChild(div);
        UI.msgs.scrollTop = UI.msgs.scrollHeight;
    }

    UI.btn.onclick = async () => {
        const text = UI.input.value.trim();
        const key = UI.key.value.trim();
        const targetId = UI.sel.value; // The selected agent
        const model = UI.model.value;

        if(!text) return;
        if(!key && !model.startsWith('onnx')) { alert('API Key Required for Cloud Models'); return; }

        if(key) localStorage.setItem('mythos_api_key', key);
        UI.input.value = '';
        
        // 1. Render User Message HERE (Once)
        renderMsg('USER', text, 'user');
        
        // 2. Broadcast with correct arguments
        // ARGUMENTS: broadcast(from, text, options)
        await STATE.conference.broadcast('USER', text, { target: targetId });
    };

    UI.input.onkeydown = (e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); UI.btn.click(); } };
    UI.key.onchange = (e) => localStorage.setItem('mythos_api_key', e.target.value.trim());
    
    UI.model.onchange = () => {
        renderMsg('SYSTEM', `Re-calibrating for ${UI.model.value}...`, 'system');
        boot(); 
    };

    const switchTab = (tab) => {
        if(tab === 'comms') {
            UI.panelComms.classList.remove('d-none');
            UI.panelForge.classList.add('d-none');
            document.getElementById('tab-comms').classList.add('active');
            document.getElementById('tab-forge').classList.remove('active');
        } else {
            UI.panelForge.classList.remove('d-none');
            UI.panelComms.classList.add('d-none');
            document.getElementById('tab-forge').classList.add('active');
            document.getElementById('tab-comms').classList.remove('active');
        }
    };
    document.getElementById('tab-comms').onclick = () => switchTab('comms');
    document.getElementById('tab-forge').onclick = () => switchTab('forge');
    document.getElementById('btn-purge').onclick = async () => { if(confirm('NUKE DB?')) { await STATE.db.clear('vectors'); location.reload(); } };

    // START
    boot();
</script>
</body>
</html>
